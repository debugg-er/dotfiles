bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.tmux.conf reloaded"

set -sg escape-time 0
set -g status-keys vi
set -g history-limit 10000
set -g mouse on
set -g focus-events on
set -g repeat-time 5000
set -g renumber-windows on
set -g set-titles on
set -s set-clipboard off

setw -g mode-keys vi
setw -g monitor-activity on
# setw -g automatic-rename-format "#{b:pane_current_path}"

# Automatically set window title
# set-window-option -g automatic-rename on

# Ctrl+B Ctrl+L to clearscreen
bind C-l send-keys 'C-l'

# Resize pane
bind -n C-M-k resize-pane -U 2
bind -n C-M-j resize-pane -D 2
bind -n C-M-h resize-pane -L 2
bind -n C-M-l resize-pane -R 2

# Split window into panes
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Select window
bind -n M-n next-window
bind -n M-p previous-window

# Kill window
bind w kill-window

# Copy to system clipboard
# bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard' bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard' bind -T copy-mode-vi Escape send-keys -X cancel

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-powerkit'

set -g @shell_mode 'vi'
set -g @yank_action 'copy-pipe'

# Remap tmux navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'M-h' if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'M-j' if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'M-k' if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'M-l' if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi 'M-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'M-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'M-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'M-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"
set -g @powerkit_separator_style "normal"
set -g @powerkit_edge_separator_style "normal"
set -g @powerkit_transparent "true"
set -g status-position bottom

run '~/.tmux/plugins/tpm/tpm'

set -g status-position bottom
# set vi-mode
set-window-option -g mode-keys vi

# 'v' start select
bind-key -T copy-mode-vi v send -X begin-selection

# 'y' or 'Enter' use copy-pipe-and-cancel
bind-key -T copy-mode-vi y send -X copy-pipe "win32yank.exe -i"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Escape send -X cancel

# enable mouse drag for copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "win32yank.exe -i"

# <prefix> p pastes from clip board
unbind-key -T prefix p
bind-key p run "win32yank.exe -o | tmux load-buffer - && tmux paste-buffer"

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:usstyle"

set -as terminal-overrides ',xterm-256color:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


